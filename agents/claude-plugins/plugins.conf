# Claude Code plugins to install, one per line:
#
#   marketplace_source | marketplace_name | plugin | trust
#
# Use a plugin only for what needs Claude Code itself (hooks, commands). Plain
# skills go in agents/skills/public.conf instead, so every agent gets them.
#
# marketplace_source: a GitHub owner/repo, or "local" for this repo's own
#   marketplace (.claude-plugin/marketplace.json), where third-party plugins are
#   pinned to the commit you reviewed.
# trust: "official" (Anthropic) or "third-party". Third-party plugins are only
#   installed after you confirm (or with yes=true). Review one before adding it:
#   plugins can run commands (hooks).
#
# Empty for now: i-have-adhd, caveman and Anthropic's document skills moved to
# agents/skills/public.conf.

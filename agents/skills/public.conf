# Public skills to install next to my own, one per line:
#
#   github_repo | commit | path_in_repo | trust
#
# Each one is downloaded at that exact commit (all 40 characters) and linked into
# every agent's skills folder, like the skills in this folder. The skill's name is
# the last part of its path. Re-running never moves a pin: to update one, review
# the new commit, then change it here. Remove a line to stop installing that skill.
#
# Review a skill before adding it: read SKILL.md and every script it ships.


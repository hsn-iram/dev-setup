# Claude Code plugins to install, one per line:
#
#   marketplace_source | marketplace_name | plugin | trust
#
# marketplace_source: a GitHub owner/repo.
# trust: "official" (Anthropic) or "third-party".
#        Third-party plugins are only installed after you confirm (or with --yes).
#        Review a third-party repo before adding it here: plugins can run commands (hooks).
#
# Remove a line to stop installing that plugin. Lines starting with # are ignored.
#
# My own skills are not plugins: they live in skills/ and work with any agent
# that supports Agent Skills. See steps/skills.sh.

anthropics/skills   | anthropic-agent-skills | document-skills | official
anthropics/skills   | anthropic-agent-skills | example-skills  | official

# github.com/ayghri/i-have-adhd (MIT). Reviewed at commit 1ecea19 (Oct 2026): one
# SKILL.md plus a SessionStart hook that only prints that file when
# ~/.claude/.i-have-adhd-always exists. No network calls, no file writes.
ayghri/i-have-adhd  | i-have-adhd            | i-have-adhd     | third-party

# github.com/JuliusBrussee/caveman (Apache-2.0). Reviewed at commit bad48a0 (Oct 2026):
# terse "caveman" replies via /caveman (lite | full | ultra). Its plugin hooks
# (SessionStart, SubagentStart, UserPromptSubmit, SessionEnd) run Node locally and make
# no network calls. They keep mode flags and a token-savings log under ~/.claude and
# ~/.config/caveman, reading the session transcript at SessionEnd. The repo also ships
# a separate caveman CLI with opt-out telemetry; this plugin doesn't install that CLI.
JuliusBrussee/caveman | caveman              | caveman         | third-party


# ~/.tmux.conf, installed by dev-setup (github.com/hsn-iram/dev-setup).
# Put personal tweaks in ~/.tmux.local.conf so re-running the setup doesn't overwrite them.
# Prefix stays the default: Ctrl+b.

# --- Terminal -----------------------------------------------------------------
# Use tmux-256color when the system has it, else the widely available fallback.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -as terminal-features ',xterm*:RGB'
set -s escape-time 10
set -g focus-events on

# --- Claude Code (code.claude.com/docs/en/terminal-config, "Configure tmux") ---
# Pass notifications and progress through to your terminal app.
set -g allow-passthrough on
# Tell Shift+Enter apart from Enter, so Shift+Enter inserts a newline in Claude Code.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# --- Quality of life ------------------------------------------------------------
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# New panes and windows open in the current directory.
bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Copy mode: v to select, y to copy to the macOS clipboard.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'

# Reload this file: prefix then r.
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'

# --- Status bar -----------------------------------------------------------------
set -g status-interval 5
set -g status-left-length 30
set -g status-left '#[bold] #S '
set -g status-right '%a %H:%M '

# --- Local overrides --------------------------------------------------------------
if-shell 'test -f ~/.tmux.local.conf' 'source-file ~/.tmux.local.conf'
